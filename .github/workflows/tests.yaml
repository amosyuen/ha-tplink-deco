name: Linting

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
  schedule:
    - cron: "0 0 * * *"

env:
  # Keep in sync with .devcontainer/devcontainer.json
  DEFAULT_PYTHON: 3.12

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    name: Pre-commit
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Upgrade pip
        run: |
          pip install --constraint=requirements.txt pip
          pip --version

      - name: Install Python modules
        run: |
          pip install --constraint=requirements.txt pre-commit black flake8 isort

      - name: Run pre-commit on all files
        run: |
          pre-commit run --all-files --show-diff-on-failure --color=always

  tests:
    runs-on: ubuntu-latest
    name: Tests / HA ${{ matrix.homeassistant-version }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13"
            homeassistant-version: "2025.12.0"
          - python-version: "3.14"
            homeassistant-version: "2026.11.0"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt \
            "homeassistant==${{ matrix.homeassistant-version }}"

      - name: Verify installed Home Assistant test environment
        env:
          EXPECTED_HA_VERSION: ${{ matrix.homeassistant-version }}
        run: |
          python - <<'PY'
          import os
          from importlib import import_module
          from importlib.metadata import version

          expected_version = os.environ["EXPECTED_HA_VERSION"]
          installed_version = version("homeassistant")
          if installed_version != expected_version:
              raise SystemExit(
                  f"Expected homeassistant=={expected_version}, "
                  f"found homeassistant=={installed_version}"
              )
          for module_name in ("homeassistant", "voluptuous", "async_timeout", "Crypto"):
              import_module(module_name)
          PY

      - name: Run regression tests
        run: |
          python -m pytest --no-cov tests/

  hacs:
    runs-on: "ubuntu-latest"
    name: HACS
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: "integration"
          ignore: brands

  hassfest:
    runs-on: ubuntu-latest
    name: Hassfest
    steps:
      - name: Check out the repository
        uses: "actions/checkout@v6"

      - name: Hassfest validation
        uses: "home-assistant/actions/hassfest@master"
