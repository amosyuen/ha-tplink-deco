name: Sync linked issues and PRs after merge

on:
  pull_request_target:
    types:
      - closed
  # Retry missing merge events using trusted default-branch code.
  schedule:
    - cron: "17 * * * *"

# Only default-branch code runs. Never check out PR heads with a write token.
permissions:
  contents: read
  issues: write
  pull-requests: write

# Serialize writes. The default single pending slot can discard merges.
concurrency:
  group: merged-reference-sync-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  synchronize:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == github.event.repository.default_branch)
      || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default-branch code only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Synchronize linked issues and related open PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/sync_merge_links.py
